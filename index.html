<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#0F0A06" />
    <!--
      Tema salvo aplicado ANTES do React montar. Sem isso, abrir o app no
      tema alternativo pisca o tema padrão por um quadro a cada
      carregamento. O tema PADRÃO (Ônix) não aparece aqui de propósito:
      ele mora no `:root` do tokens.css, então pinta certo sem JavaScript
      nenhum — este script só cobre o tema alternativo.

      Este é o único ponto do projeto que lê o localStorage fora de
      `src/lib/db/prefs.ts` (regra 5 do CLAUDE.md), e é de propósito:
      qualquer import de módulo aqui já seria tarde demais. A chave e o
      formato (JSON) são exatamente os que `prefs.ts` grava — se mudar lá,
      mude aqui. O `catch` vazio cobre navegador com storage bloqueado:
      cai no tema padrão em vez de derrubar a página.
    -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('triade_pref_theme'));
        if (t === 'perola') {
          document.documentElement.dataset.theme = 'perola';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F3EE');
        }
      } catch (e) {
        /* storage indisponível — segue no tema padrão */
      }
    </script>
    <meta name="description" content="Tríade Conecta — mulheres, negócios e conexões. Encontros presenciais mensais em Goiânia." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Tríade Conecta · App</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
