<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#F4EEE3" />
    <!--
      Tema salvo aplicado ANTES do React montar. Sem isso, abrir o app no
      tema Ônix pisca a tela clara por um quadro a cada carregamento — o
      React só monta depois do CSS já ter pintado o fundo padrão.

      Este é o único ponto do projeto que lê o localStorage fora de
      `src/lib/db/prefs.ts` (regra 5 do CLAUDE.md), e é de propósito:
      qualquer import de módulo aqui já seria tarde demais. A chave e o
      formato (JSON) são exatamente os que `prefs.ts` grava — se mudar lá,
      mude aqui. O `catch` vazio cobre navegador com storage bloqueado:
      cai no tema padrão em vez de derrubar a página.
    -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('triade_pref_theme'));
        if (t === 'onyx') {
          document.documentElement.dataset.theme = 'onyx';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0A0A');
        }
      } catch (e) {
        /* storage indisponível — segue no tema padrão */
      }
    </script>
    <meta name="description" content="Tríade Conecta — mulheres, negócios e conexões. Encontros presenciais mensais em Goiânia." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Tríade Conecta · App</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
